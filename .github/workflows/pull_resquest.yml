name: Pull Request

on: [pull_request]

jobs:
    install:
        name: Instalar Pacotes
        runs-on: ubuntu-lastest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Cache node_modules
              uses: actions/cache@v2
              with:
               path: node_modules
               key: ${{runner.os}}-${{hashFiles('**/package-lock.json')}}
            - name: Instalar Dependencia
              run: npm ci
    unusedexports:
        name: Instalar Pacotes
        runs-on: ubuntu-lastest
        needs: install
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Cache node_modules
              uses: actions/cache@v2
              with:
               path: node_modules
               key: ${{runner.os}}-${{hashFiles('**/package-lock.json')}}
            - name: Rodar ts-prune
              run: npx ts-prune --error
